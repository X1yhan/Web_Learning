<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历列表</title>
    <link rel="stylesheet" href="resume_list.css">
</head>
<body>
    <div class="list-container">
        <div class="list-header">
            <h1>简历列表</h1>
            <p class="subtitle">查看和管理所有简历</p>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索简历..." onkeyup="searchResume()">
            <button class="search-btn">搜索</button>
        </div>
        
        <div class="resume-grid" id="resumeGrid">
            <!-- 简历卡片将在这里动态生成 -->
        </div>
    </div>
    
    <script src="resume_list.js"></script>
</body>
</html>
