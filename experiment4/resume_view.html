<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历展示</title>
    <link rel="stylesheet" href="resume_view.css">
</head>
<body>
    <div class="resume-container">
        <div class="resume-header">
            <h1>个人简历</h1>
            <p class="subtitle">以下是您的简历信息</p>
        </div>
        
        <div class="resume-content">
            <!-- 基本信息 -->
            <section class="section">
                <h2>基本信息</h2>
                <div class="info-grid" id="basicInfo">
                    <div class="info-item"><span class="label">姓名：</span><span id="name">加载中...</span></div>
                    <div class="info-item"><span class="label">性别：</span><span id="gender">加载中...</span></div>
                    <div class="info-item"><span class="label">出生日期：</span><span id="birthdate">加载中...</span></div>
                    <div class="info-item"><span class="label">民族：</span><span id="nation">加载中...</span></div>
                    <div class="info-item"><span class="label">学历：</span><span id="education">加载中...</span></div>
                    <div class="info-item"><span class="label">政治面貌：</span><span id="politicalStatus">加载中...</span></div>
                    <div class="info-item"><span class="label">邮箱：</span><span id="email">加载中...</span></div>
                    <div class="info-item"><span class="label">联系电话：</span><span id="phone">加载中...</span></div>
                    <div class="info-item"><span class="label">身体状态：</span><span id="health">加载中...</span></div>
                </div>
            </section>
            
            <!-- 求职意向 -->
            <section class="section">
                <h2>求职意向</h2>
                <div class="info-grid" id="careerObjective">
                    <div class="info-item"><span class="label">期望行业：</span><span id="industry">加载中...</span></div>
                    <div class="info-item"><span class="label">求职岗位：</span><span id="position">加载中...</span></div>
                    <div class="info-item"><span class="label">求职地点：</span><span id="location">加载中...</span></div>
                    <div class="info-item"><span class="label">期望薪资：</span><span id="salary">加载中...</span></div>
                </div>
            </section>
            
            <!-- 教育经历 -->
            <section class="section">
                <h2>教育经历</h2>
                <div id="educationList">
                    <p class="loading">加载中...</p>
                </div>
            </section>
            
            <!-- 工作经历 -->
            <section class="section">
                <h2>工作经历</h2>
                <div id="workExperienceList">
                    <p class="loading">加载中...</p>
                </div>
            </section>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="resume_view.js"></script>
</body>
</html>
