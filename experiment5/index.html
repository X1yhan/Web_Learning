<!--
 * Vue 3 红绿灯模拟应用
 * 功能：模拟交通信号灯的自动切换、手动控制和倒计时显示
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 字符编码设置 -->
    <meta charset="UTF-8">
    <!-- 响应式视图设置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面标题 -->
    <title>Vue 3 Traffic Light</title>
    <!-- 引入 Vue 3 全局脚本 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Vue 应用挂载点 -->
    <div id="app">
        <!-- 主容器：包含红绿灯和控制面板 -->
        <div class="container">
            <!-- 红绿灯外壳 -->
            <div class="traffic-light-box">
                <!-- 灯组容器 -->
                <div class="light-container">
                    <!-- 红灯包装器 -->
                    <div class="light-wrapper">
                        <!-- 红灯：当 currentLight === 'red' 时激活 -->
                        <div class="light red" :class="{ active: currentLight === 'red' }"></div>
                    </div>
                    <!-- 黄灯包装器 -->
                    <div class="light-wrapper">
                        <!-- 黄灯：当 currentLight === 'yellow' 时激活，同时显示倒计时 -->
                        <div class="light yellow" :class="{ active: currentLight === 'yellow' }">
                            <!-- 倒计时数字：仅在 showCountdown 为 true 时显示 -->
                            <span v-if="showCountdown" class="countdown-text" :class="{ flashing: isGreenFlashing }">
                                {{ countdown }}
                            </span>
                        </div>
                    </div>
                    <!-- 绿灯包装器 -->
                    <div class="light-wrapper">
                        <!-- 绿灯：当 currentLight === 'green' 时激活，倒计时最后3秒闪烁 -->
                        <div class="light green" :class="{ active: currentLight === 'green', flashing: isGreenFlashing }"></div>
                    </div>
                </div>
            </div>
            
            <!-- 控制面板 -->
            <div class="control-panel">
                <!-- 面板标题 -->
                <h2 class="panel-title">Control Panel</h2>
                
                <!-- 状态显示区域 -->
                <div class="status-display">
                    <!-- 当前状态文本 -->
                    <div class="status-text">{{ statusText }}</div>
                    <!-- 倒计时显示（非保持模式时显示） -->
                    <div v-if="!isHolding">Countdown: {{ countdown }}s</div>
                </div>
                
                <!-- 时间间隔输入框组 -->
                <div class="input-group">
                    <label>Time Interval (seconds)</label>
                    <!-- 数字输入框：绑定 timeInterval，范围 5-120 秒 -->
                    <input type="number" class="time-input" v-model.number="timeInterval" min="5" max="120" @change="updateInterval">
                </div>
                
                <!-- 控制按钮组 -->
                <div class="button-group">
                    <!-- 保持红灯按钮 -->
                    <button class="control-btn btn-red" :class="{ active: holdMode === 'red' }" @click="holdRed">Hold Red</button>
                    <!-- 保持绿灯按钮 -->
                    <button class="control-btn btn-green" :class="{ active: holdMode === 'green' }" @click="holdGreen">Hold Green</button>
                    <!-- 恢复自动模式按钮 -->
                    <button class="control-btn btn-resume" @click="resumeAuto">Resume Auto</button>
                </div>
            </div>
        </div>
    </div>
    <!-- 引入应用逻辑脚本 -->
    <script src="js/app.js"></script>
</body>
</html>
